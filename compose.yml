services:
  postgres-account:
    image: postgres:16-alpine
    container_name: postgres-account
    environment:
      POSTGRES_DB: ${POSTGRES_ACCOUNT_DB:-account_db}
      POSTGRES_USER: ${POSTGRES_ACCOUNT_USER:-account_user}
      POSTGRES_PASSWORD: ${POSTGRES_ACCOUNT_PASSWORD:-account_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_account_data:/var/lib/postgresql/data
      - ./backend/account-service/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ACCOUNT_USER:-account_user} -d ${POSTGRES_ACCOUNT_DB:-account_db}"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres-music:
    image: postgres:16-alpine
    container_name: postgres-music
    environment:
      POSTGRES_DB: ${POSTGRES_MUSIC_DB:-music_db}
      POSTGRES_USER: ${POSTGRES_MUSIC_USER:-music_user}
      POSTGRES_PASSWORD: ${POSTGRES_MUSIC_PASSWORD:-music_pass}
    ports:
      - "5434:5432"
    volumes:
      - postgres_music_data:/var/lib/postgresql/data
      - ./backend/music-service/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_MUSIC_USER:-music_user} -d ${POSTGRES_MUSIC_DB:-music_db}"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  demo-audio:
    image: minio/minio
    container_name: demo-audio
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: media
    volumes:
      - ./demo/audio:/demo-audio:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set seed "$$MINIO_ENDPOINT" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" > /dev/null &&
        mc mb --ignore-existing "seed/$$MINIO_BUCKET" > /dev/null &&
        mc cp --recursive /demo-audio/ "seed/$$MINIO_BUCKET/demo/audio/" > /dev/null &&
        echo "demo audio loaded into MinIO"
    restart: "no"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: music
      RABBITMQ_DEFAULT_PASS: musicpass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: api-gateway
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:4001
      MUSIC_SERVICE_URL: http://music-service:4004
      STREAMING_SERVICE_URL: http://streaming-service:4002
      UPLOAD_SERVICE_URL: http://upload-service:4003
    depends_on:
      account-service:
        condition: service_healthy
      music-service:
        condition: service_healthy
      upload-service:
        condition: service_healthy
      streaming-service:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  account-service:
    build:
      context: ./backend/account-service
    container_name: account-service
    environment:
      DATABASE_URL: postgresql://account_user:account_pass@postgres-account:5432/account_db
      JWT_SECRET: "12345678912345678912345678912345"
      JWT_EXPIRES_IN: 1d
      JWT_ISSUER: account-service
      JWT_AUDIENCE: listener
    depends_on:
      postgres-account:
        condition: service_healthy
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4001/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  music-service:
    build:
      context: ./backend/music-service
    container_name: music-service
    environment:
      DATABASE_URL: postgresql://music_user:music_pass@postgres-music:5432/music_db
      RABBITMQ_URL: amqp://music:musicpass@rabbitmq:5672
      JWT_SECRET: "12345678912345678912345678912345"
      JWT_ISSUER: account-service
      JWT_AUDIENCE: listener
    depends_on:
      postgres-music:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "4004:4004"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4004/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  upload-service:
    build:
      context: ./backend/upload-service
    container_name: upload-service
    environment:
      RABBITMQ_URL: amqp://music:musicpass@rabbitmq:5672
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: media
      JWT_SECRET: "12345678912345678912345678912345"
      JWT_ISSUER: account-service
      JWT_AUDIENCE: listener
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      demo-audio:
        condition: service_completed_successfully
    ports:
      - "4003:4003"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4003/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  streaming-service:
    build:
      context: ./backend/streaming-service
    container_name: streaming-service
    environment:
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: media
      MUSIC_SERVICE_URL: http://music-service:4004
      PRESIGN_EXPIRY_SECONDS: 3600
      MUSIC_SERVICE_TIMEOUT_MS: 3000
    depends_on:
      minio:
        condition: service_healthy
      music-service:
        condition: service_healthy
      demo-audio:
        condition: service_completed_successfully
    ports:
      - "4002:4002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4002/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  postgres_account_data:
  postgres_music_data:
  rabbitmq_data:
  minio_data:
