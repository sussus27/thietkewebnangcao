services:
  postgres-account:
    image: postgres:16-alpine
    container_name: postgres-account
    environment:
      POSTGRES_DB: ${POSTGRES_ACCOUNT_DB:-account_db}
      POSTGRES_USER: ${POSTGRES_ACCOUNT_USER:-account_user}
      POSTGRES_PASSWORD: ${POSTGRES_ACCOUNT_PASSWORD:-account_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_account_data:/var/lib/postgresql/data
      - ./backend/account-service/db:/docker-entrypoint-initdb.d:ro
      # - ./backend/view-service/db:/docker-entrypoint-initdb.d:ro
  
  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: api-gateway
    depends_on:
      - account-service
      # - view-service
      # - streaming-service
    ports:
      - "4000:4000"

  account-service:
    build:
      context: ./backend/account-service
    container_name: account-service
    env_file:
      - ./backend/account-service/.env
    depends_on:
      - postgres-account
    ports:
      - "4001:4001"

volumes:
  postgres_account_data: