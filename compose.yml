services:
  postgres-account:
    image: postgres:16-alpine
    container_name: postgres-account
    environment:
      POSTGRES_DB: ${POSTGRES_ACCOUNT_DB:-account_db}
      POSTGRES_USER: ${POSTGRES_ACCOUNT_USER:-account_user}
      POSTGRES_PASSWORD: ${POSTGRES_ACCOUNT_PASSWORD:-account_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_account_data:/var/lib/postgresql/data
      - ./backend/account-service/db:/docker-entrypoint-initdb.d:ro

  postgres-music:
    image: postgres:16-alpine
    container_name: postgres-music
    environment:
      POSTGRES_DB: ${POSTGRES_MUSIC_DB:-music_db}
      POSTGRES_USER: ${POSTGRES_MUSIC_USER:-music_user}
      POSTGRES_PASSWORD: ${POSTGRES_MUSIC_PASSWORD:-music_pass}
    ports:
      - "5434:5432"
    volumes:
      - postgres_music_data:/var/lib/postgresql/data
      - ./backend/music-service/db:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: music
      RABBITMQ_DEFAULT_PASS: musicpass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: api-gateway
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:4001
      MUSIC_SERVICE_URL: http://music-service:4004
      STREAMING_SERVICE_URL: http://streaming-service:4002
      UPLOAD_SERVICE_URL: http://upload-service:4003
    depends_on:
      - account-service
      - music-service
      - upload-service
      - streaming-service
    ports:
      - "4000:4000"

  account-service:
    build:
      context: ./backend/account-service
    container_name: account-service
    env_file:
      - ./backend/account-service/.env
    depends_on:
      - postgres-account
    ports:
      - "4001:4001"

  music-service:
    build:
      context: ./backend/music-service
    container_name: music-service
    env_file:
      - ./backend/music-service/.env
    depends_on:
      - postgres-music
      - rabbitmq
    ports:
      - "4004:4004"

  upload-service:
    build:
      context: ./backend/upload-service
    container_name: upload-service
    env_file:
      - ./backend/upload-service/.env
    depends_on:
      - rabbitmq
      - minio
    ports:
      - "4003:4003"

  streaming-service:
    build:
      context: ./backend/streaming-service
    container_name: streaming-service
    env_file:
      - ./backend/streaming-service/.env
    depends_on:
      - minio
      - music-service
    ports:
      - "4002:4002"

volumes:
  postgres_account_data:
  postgres_music_data:
  rabbitmq_data:
  minio_data:
